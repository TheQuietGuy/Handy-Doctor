version: "3.9"

# ── Development docker-compose ─────────────────────────────────────────────────
# Spins up the full stack locally:
#   postgres  — primary database
#   redis     — rate-limiting + refresh-token store
#   api       — FastAPI application (hot-reload via uvicorn --reload)
#
# Usage:
#   docker compose up --build          # first run
#   docker compose up                  # subsequent runs
#   docker compose down -v             # stop and remove volumes
#   docker compose exec api alembic upgrade head   # run migrations manually

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       handydoctor
      POSTGRES_USER:     hduser
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hduser -d handydoctor"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── API ─────────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://hduser:devpassword@postgres:5432/handydoctor
      REDIS_URL:    redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      # Mount source for hot-reload in development
      - .:/app
      # Mount RSA keys (generated by scripts/generate-keys.sh)
      - ./private.pem:/app/private.pem:ro
      - ./public.pem:/app/public.pem:ro
    command: >
      sh -c "alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

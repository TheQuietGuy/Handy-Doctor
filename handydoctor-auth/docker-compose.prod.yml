version: "3.9"

# ══════════════════════════════════════════════════════════════════════════════
# HandyDoctor — Production docker-compose
# ══════════════════════════════════════════════════════════════════════════════
#
# Services
# ────────
#   nginx     — TLS termination, reverse proxy, static SPA serving
#   certbot   — Let's Encrypt certificate issuance and auto-renewal
#   postgres  — Primary database (PostgreSQL 16)
#   redis     — Rate-limiting + refresh-token store (Redis 7)
#   api       — FastAPI application (2+ uvicorn workers)
#
# Prerequisites
# ─────────────
#   1. DNS:   handydoctor.app → this server's public IP
#   2. Keys:  run scripts/generate-keys.sh
#   3. Env:   copy .env.production.example → .env.production and fill in values
#   4. SSL:   run scripts/setup.sh (handles initial Certbot issuance)
#   5. HTML:  place the frontend handydoc_frontend.html at ./www/index.html
#
# Quick start (after prerequisites)
# ──────────────────────────────────
#   ./scripts/setup.sh          # first-time only
#   docker compose -f docker-compose.prod.yml up -d
#
# Updates
# ───────
#   ./scripts/deploy.sh         # zero-downtime rolling update

services:

  # ── Nginx ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./www:/var/www/html:ro                   # frontend SPA
      - certbot_webroot:/var/www/certbot:ro       # ACME challenge
      - certbot_certs:/etc/letsencrypt:ro         # TLS certificates
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Certbot (Let's Encrypt) ───────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    # Renew daily; certbot only acts when < 30 days to expiry
    entrypoint: >
      /bin/sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "
    networks:
      - public

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No port exposure — only accessible within the internal network
    expose:
      - "5432"

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --save 900 1
      --save 300 10
      --save 60 10000
      --loglevel warning
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  # ── API ───────────────────────────────────────────────────────────────────
  api:
    image: handydoctor-api:latest           # built by scripts/deploy.sh
    restart: unless-stopped
    env_file: .env.production
    secrets:
      - private_key
      - public_key
    environment:
      JWT_PRIVATE_KEY_PATH: /run/secrets/private_key
      JWT_PUBLIC_KEY_PATH:  /run/secrets/public_key
      TRUST_PROXY:          "true"
    networks:
      - internal
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: >
        ["CMD-SHELL",
         "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 20s
      timeout: 8s
      start_period: 30s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first      # start new container before stopping old one
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

# ── Secrets ────────────────────────────────────────────────────────────────
secrets:
  private_key:
    file: ./private.pem
  public_key:
    file: ./public.pem

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_webroot:
    driver: local
  certbot_certs:
    driver: local
  nginx_logs:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────
networks:
  # public: nginx talks to the outside world and to certbot
  public:
    driver: bridge
  # internal: all backend services communicate here, never exposed externally
  internal:
    driver: bridge
    internal: true

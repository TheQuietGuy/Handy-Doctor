name: CI

# ══════════════════════════════════════════════════════════════════════════════
# Runs on every push and pull request.
#
# Jobs
# ────
#   lint      — ruff (style/correctness) + mypy (type checking)
#   test      — full pytest suite against real Postgres + Redis services
#   build     — Docker image build (no push) to catch Dockerfile breakage early
#   migration-check — verifies alembic upgrade head works against a fresh DB
#
# All jobs run in parallel where possible; `test` and `migration-check` both
# need services, so they each spin up their own Postgres/Redis containers
# rather than sharing one (keeps jobs independent and re-runnable).
# ══════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:   # allow manual trigger from the Actions tab

# Cancel superseded runs on the same branch/PR to save CI minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Lint & type-check ────────────────────────────────────────────────────
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          pip install ruff mypy
          pip install -r requirements.txt --quiet

      - name: Ruff (style + correctness)
        run: ruff check app/ scripts/ tests/ main.py --output-format=github

      - name: Ruff format check
        run: ruff format --check app/ scripts/ tests/ main.py

      - name: mypy (type checking)
        run: mypy app/ main.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true   # advisory for now — flip to required once clean

  # ── Test suite ────────────────────────────────────────────────────────────
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: handydoctor_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d handydoctor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --quiet
          pip install pytest-cov fakeredis --quiet

      - name: Generate test RSA keys
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_test
        run: alembic upgrade head

      - name: Run test suite with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-production
          RESEND_API_KEY: re_test_dummy_key
          FRONTEND_URL: http://localhost:3000
        run: |
          pytest tests/ \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload coverage HTML artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  # ── Migration integrity check ────────────────────────────────────────────
  migration-check:
    name: Migration up/down integrity
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: handydoctor_migtest
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d handydoctor_migtest"
          --health-interval 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt --quiet

      - name: Generate test RSA keys
        run: |
          openssl genrsa -out private.pem 2048
          openssl rsa -in private.pem -pubout -out public.pem

      - name: Upgrade to head
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_migtest
        run: alembic upgrade head

      - name: Verify current revision matches head
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_migtest
        run: |
          CURRENT=$(alembic current | grep -oP '^\w+' | head -1)
          HEAD=$(alembic heads | grep -oP '^\w+' | head -1)
          echo "Current: $CURRENT  Head: $HEAD"
          [[ "$CURRENT" == "$HEAD" ]] || (echo "Migration mismatch!" && exit 1)

      - name: Downgrade to base (verify all downgrades work)
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_migtest
        run: alembic downgrade base

      - name: Re-upgrade to head (round-trip check)
        env:
          DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/handydoctor_migtest
        run: alembic upgrade head

  # ── Docker build check ───────────────────────────────────────────────────
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]   # only build if lint passes — fail fast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: handydoctor-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image runs
        run: |
          docker run --rm \
            -e DATABASE_URL=sqlite+aiosqlite:///:memory: \
            -e SECRET_KEY=ci-check \
            -e JWT_PRIVATE_KEY_PATH=/dev/null \
            -e JWT_PUBLIC_KEY_PATH=/dev/null \
            handydoctor-api:ci-${{ github.sha }} \
            python -c "import main; print('Image OK — main module imports cleanly')"

  # ── Frontend smoke check ─────────────────────────────────────────────────
  frontend-check:
    name: Frontend HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check HTML is well-formed
        run: |
          python3 - << 'EOF'
          import re
          with open('handydoc_frontend.html') as f:
              html = f.read()

          assert html.count('<script') == 1, f"Expected 1 script tag, found {html.count('<script')}"
          assert html.count('</html>') == 1, "Missing or duplicate closing </html>"

          fns = re.findall(r'^\s*(?:async\s+)?function\s+(\w+)', html, re.MULTILINE)
          from collections import Counter
          dupes = [(n, c) for n, c in Counter(fns).items() if c > 1]
          assert not dupes, f"Duplicate function definitions: {dupes}"

          critical_fns = [
              'apiFetch', 'setPage', 'doLogin', 'doRegister', 'logout',
              'sendChatMessage', 'loadPastSessions', 'saveProfileInfo',
          ]
          missing = [f for f in critical_fns if f not in html]
          assert not missing, f"Missing critical functions: {missing}"

          print(f"OK — {html.count(chr(10))} lines, {len(fns)} functions, no duplicates")
          EOF
        continue-on-error: false

  # ── Summary gate ──────────────────────────────────────────────────────────
  # A single required status check for branch protection rules — depends on
  # every other job, so "ci-success" is the only check you need to require.
  ci-success:
    name: CI success
    runs-on: ubuntu-latest
    needs: [lint, test, migration-check, build, frontend-check]
    if: always()
    steps:
      - name: Check all jobs succeeded
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed."
            exit 1
          fi
          echo "All CI checks passed."

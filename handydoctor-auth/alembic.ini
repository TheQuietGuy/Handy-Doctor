# alembic.ini
# Alembic configuration for HandyDoctor.
#
# The database URL is intentionally NOT set here — it is pulled from the
# DATABASE_URL environment variable in migrations/env.py so that the same
# ini file works across dev, staging, and production without modification.
#
# Usage:
#   alembic upgrade head          — apply all pending migrations
#   alembic downgrade -1          — roll back one revision
#   alembic revision --autogenerate -m "add_table"  — generate new migration
#   alembic history               — list all revisions
#   alembic current               — show applied revisions

[alembic]
script_location = migrations

# Revision file naming: timestamp_slug.py  (e.g. 20260519_add_chat_tables.py)
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

# Encoding for migration scripts
output_encoding = utf-8

# Migration source tree (leave blank to use script_location)
version_locations = %(here)s/migrations/versions

# Logging — mirrors Python's logging.config.fileConfig format
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

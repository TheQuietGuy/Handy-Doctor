# nginx/nginx.conf
# ══════════════════════════════════════════════════════════════════════════════
# HandyDoctor — Production Nginx Configuration
# ══════════════════════════════════════════════════════════════════════════════
#
# Responsibilities:
#   • TLS termination (certificates managed by Certbot / Let's Encrypt)
#   • HTTP → HTTPS redirect
#   • Reverse proxy to the FastAPI application (upstream: api:8000)
#   • Static file serving for the frontend SPA
#   • Security headers (HSTS, CSP, X-Frame-Options, etc.)
#   • Connection-level rate limiting (supplements app-layer limits)
#   • Gzip compression
#   • WebSocket upgrade support (for future streaming)

# ── Tuning ────────────────────────────────────────────────────────────────────
worker_processes      auto;
worker_rlimit_nofile  65535;
pid                   /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ── MIME types ─────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;
    error_log   /var/log/nginx/error.log   warn;

    # ── Performance ────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    types_hash_max_size 4096;
    server_tokens       off;       # hide nginx version

    # ── Gzip ───────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/css
        text/html
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ── Connection-level rate limiting ─────────────────────────────────────
    # Zone 1: general API — 30 req/s per IP (burstable to 60)
    limit_req_zone  $binary_remote_addr  zone=api_general:10m   rate=30r/s;
    # Zone 2: auth endpoints — 5 req/s per IP (tighter; app layer adds more)
    limit_req_zone  $binary_remote_addr  zone=api_auth:10m      rate=5r/s;
    # Zone 3: static files — very permissive
    limit_req_zone  $binary_remote_addr  zone=static:10m        rate=100r/s;

    limit_req_status  429;
    limit_conn_zone   $binary_remote_addr zone=conn_per_ip:10m;

    # ── Upstream: FastAPI application ──────────────────────────────────────
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────
    server {
        listen       80;
        listen  [::]:80;
        server_name  handydoctor.app www.handydoctor.app;

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Main HTTPS server ──────────────────────────────────────────────────
    server {
        listen       443 ssl;
        listen  [::]:443 ssl;
        http2        on;
        server_name  handydoctor.app www.handydoctor.app;

        # ── TLS certificates (managed by Certbot) ─────────────────────
        ssl_certificate     /etc/letsencrypt/live/handydoctor.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/handydoctor.app/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/handydoctor.app/chain.pem;

        # Modern TLS configuration (Mozilla Intermediate profile)
        ssl_protocols               TLSv1.2 TLSv1.3;
        ssl_ciphers                 ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers   off;
        ssl_session_timeout         1d;
        ssl_session_cache           shared:MozSSL:10m;
        ssl_session_tickets         off;
        ssl_stapling                on;
        ssl_stapling_verify         on;
        resolver                    1.1.1.1 8.8.8.8 valid=300s;
        resolver_timeout            5s;

        # ── Security headers ───────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options    "nosniff"                                      always;
        add_header X-Frame-Options           "SAMEORIGIN"                                   always;
        add_header X-XSS-Protection          "1; mode=block"                                always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

        # Content Security Policy — adjust 'connect-src' if using external APIs directly
        add_header Content-Security-Policy
            "default-src 'self'; "
            "script-src 'self' 'unsafe-inline'; "
            "style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; "
            "font-src 'self' https://fonts.gstatic.com; "
            "img-src 'self' data: https:; "
            "connect-src 'self' https://api.resend.com; "
            "frame-ancestors 'none'; "
            "base-uri 'self'; "
            "form-action 'self';"
            always;

        # ── Request size limits ────────────────────────────────────────
        client_max_body_size    10m;   # upload limit
        client_body_timeout     30s;
        client_header_timeout   30s;
        send_timeout            30s;

        # ── Connection limits ──────────────────────────────────────────
        limit_conn conn_per_ip 50;

        # ── Frontend SPA (static HTML file) ───────────────────────────
        root /var/www/html;
        index index.html;

        location / {
            limit_req zone=static burst=20 nodelay;
            try_files $uri $uri/ /index.html;

            # Cache control for the SPA shell — short TTL so deployments propagate
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }
        }

        # ── API proxy ──────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_general burst=60 nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_connect_timeout  10s;
            proxy_send_timeout     60s;
            proxy_read_timeout     60s;

            # WebSocket support (for future streaming chat)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Stricter rate limit on auth endpoints at the nginx level
        location ~ ^/api/accounts/(login|register|forgot-password|reset-password|verify-email) {
            limit_req zone=api_auth burst=10 nodelay;

            proxy_pass         http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ── Health check (no logging, no rate limit) ───────────────────
        location = /health {
            access_log off;
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
        }

        # ── Docs (disable in production if not needed) ─────────────────
        location ~ ^/(docs|redoc|openapi.json) {
            # Remove this block or add IP allowlist to restrict API docs
            limit_req zone=api_general burst=10;
            proxy_pass         http://api_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Block common attack paths ──────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        location ~ \.(env|git|sh|sql|conf|ini|log)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
